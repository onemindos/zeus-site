name: Build & Deploy zeus-site

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: onemindos/zeus-site

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, amd64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            DATABASE_URI=${{ secrets.DATABASE_URI_ZEUS }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET_ZEUS }}

      - name: Roll out new image on cluster
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_ZEUS }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kube.yaml
          kubectl --kubeconfig=/tmp/kube.yaml -n zeus-site \
            set image deployment/zeus-site \
            zeus-site=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl --kubeconfig=/tmp/kube.yaml -n zeus-site \
            rollout status deployment/zeus-site --timeout=120s
          rm -f /tmp/kube.yaml
