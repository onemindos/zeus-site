name: Deploy to Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-zeus
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write env
        env:
          GHOST_ZEUS_CONTENT_KEY: ${{ secrets.GHOST_ZEUS_CONTENT_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET_ZEUS }}
        run: |
          printf 'GHOST_URL=http://host.docker.internal:2368\nGHOST_CONTENT_API_KEY=%s\nREVALIDATE_SECRET=%s\n' \
            "$GHOST_ZEUS_CONTENT_KEY" "$REVALIDATE_SECRET" > .env.production

      - name: Build and deploy
        run: docker compose up -d --build

      - name: Health check
        run: |
          sleep 5
          curl -f http://localhost:3001 || exit 1

      - name: Clean up old images
        run: docker image prune -f
