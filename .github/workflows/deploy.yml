name: Deploy zeus-site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, zeus-v2]
    steps:
      - uses: actions/checkout@v4

      - name: Write env
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI_ZEUS }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET_ZEUS }}
        run: |
          printf 'DATABASE_URI=%s\nPAYLOAD_SECRET=%s\n' \
            "$DATABASE_URI" "$PAYLOAD_SECRET" > .env.production

      - name: Build and start
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI_ZEUS }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET_ZEUS }}
        run: |
          DATABASE_URI="$DATABASE_URI" PAYLOAD_SECRET="$PAYLOAD_SECRET" \
            docker compose up -d --build

      - name: Health check
        run: sleep 10 && curl -f http://localhost:3001 || exit 1

      - name: Prune images
        run: docker image prune -f
